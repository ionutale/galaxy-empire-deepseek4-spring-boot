apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: galaxy-empire
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: galaxy-empire
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: 'Galaxy Empire'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
