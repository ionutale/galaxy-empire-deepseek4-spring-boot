apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-config
  namespace: galaxy-empire
data:
  auth-service.yml: |
    server:
      port: 8081
    spring:
      application:
        name: auth-service
      datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
        username: ${DB_USER:auth_user}
        password: ${DB_PASSWORD:auth_pass}
        hikari:
          maximum-pool-size: 10
          minimum-idle: 2
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
    eureka:
      client:
        serviceUrl:
          defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
      instance:
        prefer-ip-address: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        tags:
          application: auth-service
    jwt:
      secret: ${JWT_SECRET:default-secret-change-in-production-at-least-256-bits-long}
      expiration-ms: 86400000
    logging:
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      level:
        com.galaxyempire: INFO
  game-service.yml: |
    server:
      port: 8082
    spring:
      application:
        name: game-service
      datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:game_db}
        username: ${DB_USER:game_user}
        password: ${DB_PASSWORD:game_pass}
        hikari:
          maximum-pool-size: 10
          minimum-idle: 2
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
      flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
    eureka:
      client:
        serviceUrl:
          defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
      instance:
        prefer-ip-address: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        tags:
          application: game-service
        export:
          prometheus:
            enabled: true
    logging:
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      level:
        com.galaxyempire: INFO
        org.springframework.web.socket: DEBUG
    game:
      universe:
        galaxies: 9
        systems-per-galaxy: 500
        slots-per-system: 15
      speed: ${UNIVERSE_SPEED:1}
      constructions:
        max-queue-per-planet: 5
    jwt:
      secret: ${JWT_SECRET:default-secret-change-in-production-at-least-256-bits-long}
  gateway.yml: |
    server:
      port: 8080
    spring:
      application:
        name: gateway
      cloud:
        gateway:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/game/**
            - id: game-service-ws
              uri: lb:ws://game-service
              predicates:
                - Path=/ws/**
    eureka:
      client:
        serviceUrl:
          defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
      instance:
        prefer-ip-address: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          show-details: always
    jwt:
      secret: ${JWT_SECRET:default-secret-change-in-production-at-least-256-bits-long}
    logging:
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      level:
        com.galaxyempire: INFO
