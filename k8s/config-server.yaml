apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: galaxy-empire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: localhost:5000/galaxy-empire/config-server:latest
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "448Mi"
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: native
            - name: spring.cloud.config.server.native.search-locations
              value: file:/config/
          volumeMounts:
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: config-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: galaxy-empire
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
