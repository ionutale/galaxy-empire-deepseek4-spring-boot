apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: galaxy-empire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: localhost:5000/galaxy-empire/eureka-server:latest
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "448Mi"
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: galaxy-empire
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
