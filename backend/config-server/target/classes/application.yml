server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        bootstrap: false
        native:
          search-locations: classpath:/config/

  profiles:
    active: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.galaxyempire: INFO
